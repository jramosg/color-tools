version: 2
updates:
  # deps.edn is not supported by Dependabot; Clojure deps are updated by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /demo
    schedule:
      interval: weekly
    # Wait before proposing brand-new releases (supply-chain safety).
    # Security updates are not delayed.
    cooldown:
      default-days: 2
    groups:
      react:
        patterns: ["react", "react-dom"]
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Skip non-LTS Java images so Dependabot only opens a PR for the
      # next LTS (29). Once on 29, change the range to ">= 30, < 33".
      - dependency-name: clojure
        versions: [">= 26, < 29"]
