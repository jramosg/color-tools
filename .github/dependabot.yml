version: 2
updates:
  # deps.edn is not supported by Dependabot; Clojure deps are updated by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /demo
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on the Java LTS; move to the next one (29) by hand.
      - dependency-name: clojure
        update-types: ["version-update:semver-major"]
