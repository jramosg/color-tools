name: Deploy demo to VPS

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Checks"]
    types:
      - completed

jobs:
  build-and-deploy:
    name: Build and Deploy to VPS
    runs-on: ubuntu-latest
    # head_branch alone is not enough: a fork PR from a branch named
    # "master" also reports head_branch == 'master'. Require a push to
    # this repository so fork code never runs next to the deploy key.
    # Put [skip deploy] in the commit message (or the PR title, for a
    # squash merge) to leave the demo as it is; manual runs always deploy.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name ==
         github.repository &&
       github.event.workflow_run.head_branch == 'master' &&
       !contains(github.event.workflow_run.head_commit.message,
                 '[skip deploy]'))
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install Clojure
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: latest

      - name: Cache Clojure dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: clj-${{ hashFiles('demo/deps.edn') }}
          restore-keys: clj-

      - name: Cache npm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: demo/node_modules
          key: npm-${{ hashFiles('demo/package-lock.json') }}
          restore-keys: npm-

      - name: Cache shadow-cljs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: demo/.shadow-cljs
          key: shadow-${{ hashFiles('demo/deps.edn', 'demo/shadow-cljs.edn') }}
          restore-keys: shadow-

      - name: Install npm dependencies
        working-directory: demo
        run: npm ci

      - name: Build demo
        working-directory: demo
        env:
          CI: true
        run: npm run build

      - name: Patch index.html with hashed JS filename
        run: |
          JS_FILE=$(grep -o '"main\.[^"]*\.js"' demo/public/js/manifest.edn | tr -d '"')
          sed -i "s|js/main\.js|js/${JS_FILE}|g" demo/public/index.html

      - name: Package static files
        run: tar -czf color-tools-demo.tar.gz -C demo/public .

      - name: Deploy through the restricted CI gate
        # The key can only run `deploy color-tools` on the server, which
        # replaces /var/www/color-tools with the uploaded plain files.
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEmoaMAZ9yKpppVl6J2NPsXsirLII1K5/FR47keXM215
        run: |
          set -eu
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          echo "vps $HOST_KEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o HostKeyAlias=vps \
            -o StrictHostKeyChecking=yes "ci@$SERVER_HOST" \
            deploy color-tools < color-tools-demo.tar.gz

      - name: Verify site
        run: >-
          curl -fsS --retry 5 --retry-delay 3 -o /dev/null
          https://color-tools.jonramos.dev/
