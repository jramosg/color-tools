name: Checks

on:
  push:
    # run checks on every branch
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ '**' ]

jobs:
  checks:
    name: Checks (format + tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest
          clj-kondo: 2026.10.26
          cljfmt: 0.16.6

      - name: Cache clojure dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
            .cpcache
          key: cljdeps-${{ hashFiles('deps.edn') }}
          restore-keys: cljdeps-

      - name: Run cljfmt check
        run: cljfmt check

      - name: Run clj-kondo linter
        run: clj-kondo --lint src test

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run Clojure tests
        run: clojure -T:build test

      - name: Run ClojureScript tests
        run: clojure -M:test-cljs
